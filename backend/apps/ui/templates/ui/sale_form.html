{% extends 'base.html' %}

{% block content %}
<h2>Create Sale</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    {{ formset.management_form }}
    <h4>Items (1-3 lines)</h4>
    {% for item_form in formset %}
        <div class="border p-3 mb-2">
            {{ item_form.as_p }}
        </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
