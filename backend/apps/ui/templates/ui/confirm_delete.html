{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="card shadow-sm border-danger-subtle">
    <div class="card-body">
        <h2 class="h4 mb-3 text-danger">{{ page_title }}</h2>
        <p>Вы уверены, что хотите удалить: <strong>{{ object }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
