{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Sales</h2>
    <a href="{% url 'ui:sale_create' %}" class="btn btn-success">Create sale</a>
</div>
<table class="table table-bordered">
    <thead><tr><th>ID</th><th>Date</th><th>Customer</th><th>Warehouse</th><th>Total</th></tr></thead>
    <tbody>
    {% for sale in object_list %}
        <tr>
            <td>{{ sale.id }}</td><td>{{ sale.sale_date }}</td><td>{{ sale.customer }}</td><td>{{ sale.warehouse }}</td><td>{{ sale.total }}</td>
        </tr>
    {% empty %}
        <tr><td colspan="5">No sales.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
