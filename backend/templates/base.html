<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printer Warehouse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'ui:dashboard' %}">Printer Warehouse</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'ui:dashboard' %}">Dashboard</a>
            <a class="nav-link" href="{% url 'ui:warehouse_list' %}">Warehouses</a>
            <a class="nav-link" href="{% url 'ui:printer_list' %}">Printers</a>
            <a class="nav-link" href="{% url 'ui:movement_list' %}">Movements</a>
            <a class="nav-link" href="{% url 'ui:sale_list' %}">Sales</a>
            <a class="nav-link" href="{% url 'ui:return_list' %}">Returns</a>
            <a class="nav-link" href="/admin/">Admin</a>
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'logout' %}">Logout</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
