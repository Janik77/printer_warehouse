<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Printer Warehouse{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid" style="max-width: 1400px;">
        <a class="navbar-brand fw-semibold" href="{% url 'ui:dashboard' %}">Printer Warehouse</a>
        <div class="navbar-nav">
            <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'ui:dashboard' %}"><i class="bi bi-speedometer2 me-1"></i>Панель управления</a>
            <a class="nav-link {% if 'warehouse' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'ui:warehouse_list' %}"><i class="bi bi-buildings me-1"></i>Склады</a>
            <a class="nav-link {% if 'printer' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'ui:printer_list' %}"><i class="bi bi-printer me-1"></i>Принтеры</a>
            <a class="nav-link {% if 'movement' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'ui:movement_list' %}"><i class="bi bi-arrow-left-right me-1"></i>Перемещения</a>
            <a class="nav-link {% if 'sale' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'ui:sale_list' %}"><i class="bi bi-cart-check me-1"></i>Продажи</a>
            <a class="nav-link {% if 'return' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'ui:return_list' %}"><i class="bi bi-arrow-counterclockwise me-1"></i>Возвраты</a>
            <a class="nav-link" href="/admin/"><i class="bi bi-shield-lock me-1"></i>Админка</a>
            {% if user.is_authenticated %}
                <a class="nav-link" href="{% url 'logout' %}"><i class="bi bi-box-arrow-right me-1"></i>Выход</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container py-4" style="max-width: 1400px;">
    {% if messages %}
        {% for message in messages %}
            <div class="alert shadow-sm alert-{% if message.tags == 'error' %}danger{% elif message.tags == 'debug' %}secondary{% else %}{{ message.tags }}{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
